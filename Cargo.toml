[workspace]
resolver = "3"
members = ["core", "frontend", "src-tauri"]
default-members = ["core"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
minesweeper-core = { path = "core" }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
